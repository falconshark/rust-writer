[package]
name = "rustwriter"
version = "0.1.0"
edition = "2021"
description = "A fullscreen distraction-free writing app inspired by FocusWriter"
authors = ["Mr.Twister"]
license = "GPL-3.0"

[dependencies]
eframe = { version = "0.28", features = ["default"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["image", "file"] }

# Image loading
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }

# Serialization for settings/config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# File dialogs
rfd = "0.14"

# Text/document handling
chrono = { version = "0.4", features = ["serde"] }

# Directories for config/save paths
directories = "5.0"

# Audio for typewriter sounds
rodio = "0.17"

# Logging
log = "0.4"
env_logger = "0.11"

[package.metadata.bundle]
name = "RustWriter"
identifier = "com.rustwriter.app"
icon = ["assets/icon.png"]
category = "public.app-category.productivity"
short_description = "A fullscreen distraction-free writing app inspired by FocusWriter"

[package.metadata.deb]
section = "editors"
priority = "optional"
assets = [
    { source = "target/release/rustwriter", dest = "usr/bin/", mode = "755" },
    { source = "rustwriter.desktop", dest = "usr/share/applications/", mode = "644" },
    { source = "assets/icon.png", dest = "usr/share/pixmaps/rustwriter.png", mode = "644" },
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
