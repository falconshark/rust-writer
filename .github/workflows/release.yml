name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Linux .deb
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo-deb binary
        uses: actions/cache@v4
        id: cache-cargo-deb
        with:
          path: ~/.cargo/bin/cargo-deb
          key: cargo-deb-1.44

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libasound2-dev

      - name: Install cargo-deb
        if: steps.cache-cargo-deb.outputs.cache-hit != 'true'
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb

      - name: Get package path
        id: deb_path
        run: echo "path=$(ls target/debian/*.deb)" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deb_path.outputs.path }}
          generate_release_notes: true

  build-macos:
    name: Build macOS universal .app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo-bundle binary
        uses: actions/cache@v4
        id: cache-cargo-bundle
        with:
          path: ~/.cargo/bin/cargo-bundle
          key: cargo-bundle-0.6

      - name: Install cargo-bundle
        if: steps.cache-cargo-bundle.outputs.cache-hit != 'true'
        run: cargo install cargo-bundle --locked

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create -output target/release/rustwriter \
            target/aarch64-apple-darwin/release/rustwriter \
            target/x86_64-apple-darwin/release/rustwriter

      - name: Bundle .app
        run: cargo bundle --release

      - name: Ad-hoc code sign
        run: codesign --force --deep --sign - target/release/bundle/osx/RustWriter.app

      - name: Zip .app
        run: |
          cd target/release/bundle/osx
          zip -r RustWriter-macos.zip RustWriter.app

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/osx/RustWriter-macos.zip

  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Zip .exe
        run: Compress-Archive -Path target/release/rustwriter.exe -DestinationPath RustWriter-windows.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RustWriter-windows.zip
